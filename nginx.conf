server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /refresh {
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="refresh" content="1;url=/?refresh=1"><title>Refreshing Crick English</title><body style="font:16px system-ui;padding:32px"><h1>Crick English</h1><p>Refreshing website files...</p><a href="/?refresh=1">Continue to website</a></body></html>';
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
